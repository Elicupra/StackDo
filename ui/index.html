<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>TodoApp – Frontend</title>

    <!-- Bootstrap 5 CDN (solo CSS) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet"/>
    <link href="styles.css" rel="stylesheet"/>

    <!-- Icono de la pestaña -->
    <link rel="icon" type="image/svg+xml"
          href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M2 2h12v12H2z' fill='%23000'/></svg>">
</head>

<body class="bg-light">

<div class="container py-4">

    <!-- ========   1. Formulario de nueva tarea   ======== -->
    <form id="taskForm" class="row g-3 mb-4">
        <div class="col-md-6"><input id="title" class="form-control"
            placeholder="Título" required></div>
        <div class="col-md-6"><input id="desc" class="form-control"
            placeholder="Descripción"></div>

        <div class="col-md-3">
            <select id="status" class="form-select">
                <option value="pendiente">Pendiente</option>
                <option value="en_progreso">En progreso</option>
                <option value="completada">Completada</option>
            </select>
        </div>

        <div class="col-md-3"><input id="prio" type="number"
            class="form-control" placeholder="Prioridad (1‑5)" min="1" max="5"></div>

        <div class="col-md-3">
            <input id="due" type="date" class="form-control"/>
        </div>

        <div class="col-md-3"><button type="submit"
                class="btn btn-primary w-100">Añadir</button></div>
    </form>

    <!-- ========   2. Tabla de tareas   ======== -->
    <table class="table table-hover">
        <thead class="table-light">
            <tr><th>Título</th><th>Estado</th><th>Prioridad</th>
                <th>Vence</th><th>Acciones</th></tr>
        </thead>
        <tbody id="taskTable"></tbody>
    </table>

</div>

<!-- Bootstrap JS (opcional, solo para tooltips) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-..." crossorigin="anonymous"></script>

<!-- Nuestro script con toda la lógica -->
<script src="main.js" defer></script>
</body>
</html>
