<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>TodoApp – Frontend</title>

    <!-- Bootstrap 5 CDN (solo CSS) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet"/>
    <link href="styles.css" rel="stylesheet"/>

    <!-- Icono de la pestaña -->
    <link rel="icon" type="image/svg+xml"
          href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M2 2h12v12H2z' fill='%23000'/></svg>">
</head>

<body class="bg-light">

<div class="container py-4">

        <!-- ========   1. Panel de Proyectos y acciones   ======== -->
        <div class="d-flex align-items-center gap-2 mb-3">
                <div>
                        <select id="projectSelect" class="form-select"></select>
                </div>
                <div>
                        <button id="createProjectBtn" class="btn btn-outline-secondary">Crear proyecto</button>
                </div>
                <div class="ms-auto">
                        <button id="openCreateBtn" class="btn btn-primary">Crear tarea</button>
                </div>
        </div>

        <!-- Modal: Crear / Editar Tarea -->
        <div class="modal fade" id="taskModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="taskModalLabel">Crear tarea</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <form id="taskForm" class="row g-3">
                                <div class="col-12"><input id="title" class="form-control" placeholder="Título" required></div>
                                <div class="col-12"><input id="desc" class="form-control" placeholder="Descripción"></div>
                                <div class="col-md-6">
                                        <select id="status" class="form-select">
                                                <option value="pendiente">Pendiente</option>
                                                <option value="en_progreso">En progreso</option>
                                                <option value="completada">Completada</option>
                                        </select>
                                </div>
                                <div class="col-md-6"><input id="prio" type="number" class="form-control" placeholder="Prioridad (1‑5)" min="1" max="5"></div>
                                <div class="col-md-6"><input id="due" type="date" class="form-control"/></div>
                                <div class="col-md-6">
                                        <select id="taskProjectSelect" class="form-select">
                                                <option value="">Sin proyecto</option>
                                        </select>
                                </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                        <button id="taskSaveBtn" type="button" class="btn btn-primary">Guardar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal: Detalle de tarea -->
        <div class="modal fade" id="taskDetailModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="taskDetailLabel">Tarea</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body" id="taskDetailBody">
                        <!-- contenido dinámico -->
                    </div>
                    <div class="modal-footer">
                        <button id="detailEditBtn" type="button" class="btn btn-outline-primary">Editar</button>
                        <button id="detailCompleteBtn" type="button" class="btn btn-success">Completar</button>
                        <button id="detailDeleteBtn" type="button" class="btn btn-danger">Eliminar</button>
                    </div>
                </div>
            </div>
        </div>

    <!-- ========   2. Tabla de tareas   ======== -->
    <table class="table table-hover">
        <thead class="table-light">
            <tr><th>Título</th><th>Estado</th><th>Prioridad</th>
                <th>Vence</th><th>Acciones</th></tr>
        </thead>
        <tbody id="taskTable"></tbody>
    </table>

</div>

<!-- Bootstrap JS (opcional, solo para tooltips) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-..." crossorigin="anonymous"></script>

<!-- Nuestro script con toda la lógica -->
<script src="main.js" defer></script>
</body>
</html>
