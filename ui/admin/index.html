<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StackDo - Consola IT</title>
    <link rel="icon" type="image/png" href="../assets/stackdo-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css" />
</head>
<body>
    <div class="shell">
        <header class="topbar">
            <div class="brand">
                <img src="../assets/stackdo-logo.png" alt="StackDo" />
                <div>
                    <div class="title">StackDo IT Console</div>
                    <div class="subtitle">Administracion y auditoria</div>
                </div>
            </div>
            <div class="topbar-actions">
                <span id="currentAdmin" class="pill">No autenticado</span>
                <button id="logoutBtn" class="btn ghost">Cerrar sesion</button>
            </div>
        </header>

        <main>
            <section id="loginPanel" class="panel">
                <h2>Acceso IT</h2>
                <p class="muted">Ingresa con un usuario con rol ITAdmin o SuperAdmin.</p>
                <div class="form-grid">
                    <label>
                        Identificador (email o id_usuario)
                        <input id="loginIdentifier" type="text" placeholder="admin@stackdo.local" />
                    </label>
                    <label>
                        Contrasena
                        <input id="loginPassword" type="password" placeholder="********" />
                    </label>
                </div>
                <div id="loginError" class="error hidden">Credenciales invalidas</div>
                <button id="loginBtn" class="btn primary">Entrar</button>
            </section>

            <section id="adminPanel" class="panel hidden">
                <div class="tabs">
                    <button class="tab active" data-tab="users">Usuarios</button>
                    <button class="tab" data-tab="projects">Proyectos</button>
                    <button class="tab" data-tab="logs">Logs</button>
                    <button class="tab" data-tab="backups">Backups</button>
                </div>

                <div class="tab-content active" id="tab-users">
                    <div class="section-header">
                        <h3>Usuarios</h3>
                        <button id="refreshUsers" class="btn ghost">Actualizar</button>
                    </div>
                    <div id="usersTable" class="table"></div>
                </div>

                <div class="tab-content" id="tab-projects">
                    <div class="section-header">
                        <h3>Proyectos</h3>
                        <button id="refreshProjects" class="btn ghost">Actualizar</button>
                    </div>
                    <div id="projectsTable" class="table"></div>
                </div>

                <div class="tab-content" id="tab-logs">
                    <div class="section-header">
                        <h3>Logs</h3>
                        <button id="refreshLogs" class="btn ghost">Actualizar</button>
                    </div>
                    <div id="logsTable" class="table"></div>
                </div>

                <div class="tab-content" id="tab-backups">
                    <div class="section-header">
                        <h3>Backups</h3>
                        <div class="button-row">
                            <button id="createJsonBackup" class="btn primary">Crear JSON</button>
                            <button id="createCsvBackup" class="btn ghost">Crear CSV</button>
                        </div>
                    </div>
                    <div id="backupsTable" class="table"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="admin.js"></script>
</body>
</html>
